[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidewalk-ai"
version = "0.1.0"
description = "Sidewalk width estimation and obstacle analysis from Street View imagery."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Diego Guerra" },
  { name = "Juan Oliveira de Carvalho" },
]
dependencies = [
  "joblib>=1.5",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "requests>=2.32",
  "scipy>=1.13",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = [
  "black>=25.0",
  "pytest>=8.0",
  "ruff>=0.8",
]
ml = [
  "matplotlib>=3.9",
  "pillow>=10.0",
  "torch",
  "torchvision",
  "transformers>=4.49",
]

[project.urls]
Repository = "https://github.com/juanocv/sidewalk-analysis"

[project.scripts]
sidewalk-ai-diagnostics = "sidewalk_ai.diagnostics:main"

[tool.setuptools.packages.find]
include = ["sidewalk_ai*"]
exclude = [
  "generic*",
  "prototype*",
  "DeepLabV3Plus-Pytorch*",
  "detectron2*",
  "OneFormer*",
  "ZoeDepth*",
]

[tool.pytest.ini_options]
testpaths = ["sidewalk_ai/tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
  "gpu: requires GPU or heavyweight ML model downloads",
  "network: requires external API access",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["sidewalk_ai"]
extend-exclude = [
  "DeepLabV3Plus-Pytorch",
  "detectron2",
  "generic",
  "OneFormer",
  "prototype",
  "ZoeDepth",
]

[tool.ruff.lint]
select = ["E9", "F"]
